<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="もじバトル">
<title>ポケモンもじバトル</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif; background: #0b0f2a; color: #fff; }
  .screen { position: absolute; inset: 0; display: none; overflow: hidden; }
  .screen.show { display: block; }
  .btn { border: none; border-radius: 16px; padding: 12px 26px; font-size: 22px; font-weight: bold; color: #fff; background: #26a69a; box-shadow: 0 5px 0 rgba(0,0,0,0.35); cursor: pointer; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,0.35); }
  .btn.red { background: #e53935; } .btn.blue { background: #1e88e5; } .btn.gray { background: #78909c; } .btn.gold { background: #f9a825; color: #3e2723; }
  #warn { position: absolute; top: 0; left: 0; right: 0; z-index: 999; background: #b71c1c; color: #fff; font-size: 15px; text-align: center; padding: 6px; display: none; }

  #start { background: radial-gradient(circle at 50% 40%, #1a237e 0%, #0b0f2a 70%); }
  #start canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #startBox { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 34px; z-index: 5; }
  #logo { font-size: min(9vw, 11vh); font-weight: 900; letter-spacing: .06em; color: #ffeb3b; text-shadow: 0 0 12px #ffeb3b, 0 0 36px #ff9800, 0 6px 0 #b71c1c; text-align: center; animation: glow 2s infinite alternate; }
  @keyframes glow { from { filter: brightness(1); } to { filter: brightness(1.4); } }
  #ballLogo { width: min(22vh, 30vw); height: min(22vh, 30vw); border-radius: 50%; background: linear-gradient(#e53935 0 46%, #212121 46% 54%, #fafafa 54%); border: 6px solid #212121; position: relative; box-shadow: 0 0 40px rgba(255,235,59,.7); animation: spinball 6s linear infinite; }
  #ballLogo::after { content: ""; position: absolute; left: 50%; top: 50%; width: 26%; aspect-ratio: 1; transform: translate(-50%,-50%); border-radius: 50%; background: #fff; border: 6px solid #212121; }
  @keyframes spinball { to { transform: rotate(360deg); } }
  #startBtn { font-size: min(6vw, 7vh); padding: 18px 60px; border-radius: 60px; background: linear-gradient(#ff7043, #e53935); box-shadow: 0 8px 0 #7f0000, 0 0 30px rgba(255,112,67,.8); animation: pulse 1.4s infinite; }
  @keyframes pulse { 50% { transform: scale(1.07); } }
  #startSub { font-size: 18px; color: #90a4ae; }

  #lab { background: linear-gradient(#cfd8dc 0%, #eceff1 55%, #90a4ae 55%, #78909c 100%); color: #263238; }
  #lab .title { position: absolute; top: 10px; left: 0; right: 0; text-align: center; font-size: min(5vw, 5vh); font-weight: 900; color: #1a237e; text-shadow: 0 2px 0 #fff; z-index: 20; }
  #lab .stage { position: absolute; top: 4%; left: 0; right: 0; text-align: center; font-size: 18px; color: #455a64; z-index: 20; margin-top: min(6vw, 6vh); }
  #labRow { position: absolute; left: 0; right: 0; top: 22%; bottom: 20%; display: flex; justify-content: space-around; align-items: flex-end; padding: 0 3%; }
  .labItem { position: relative; width: min(29vw, 36vh); height: 100%; cursor: pointer; }
  .labItem .peek { position: absolute; left: 12%; width: 76%; bottom: 62%; height: min(9vw, 11vh); overflow: hidden; z-index: 1; }
  .labItem .peek img { position: absolute; left: 0; top: 0; width: 100%; height: auto; }
  .labItem .peek .emo { position: absolute; left: 0; right: 0; top: 0; text-align: center; font-size: min(10vw, 12vh); }
  .labItem .cover { position: absolute; left: 0; right: 0; bottom: 8%; height: 56%; z-index: 2; border-radius: 14px; box-shadow: 0 8px 0 rgba(0,0,0,.25); }
  .cover.tube { background: linear-gradient(90deg, rgba(120,200,255,.55), rgba(255,255,255,.75), rgba(120,200,255,.55)); border: 4px solid #607d8b; border-radius: 60px 60px 14px 14px; }
  .cover.tube::before { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 40%; background: rgba(66,165,245,.5); border-radius: 0 0 10px 10px; }
  .cover.box { background: repeating-linear-gradient(90deg, #8d6e63 0 18px, #795548 18px 20px); border: 4px solid #4e342e; }
  .cover.box::after { content: "?"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: min(10vw, 12vh); color: rgba(255,255,255,.7); font-weight: 900; }
  .cover.machine { background: linear-gradient(#546e7a, #37474f); border: 4px solid #263238; }
  .cover.machine::before { content: ""; position: absolute; left: 12%; top: 14%; width: 76%; height: 26%; background: #00e676; border-radius: 6px; box-shadow: 0 0 14px #00e676; animation: blinkm 1.2s infinite; }
  .cover.machine::after { content: ""; position: absolute; left: 14%; bottom: 14%; width: 22%; aspect-ratio: 1; background: #ff5252; border-radius: 50%; box-shadow: 40px 0 0 #ffee58, 80px 0 0 #42a5f5; }
  @keyframes blinkm { 50% { opacity: .4; } }
  .labItem .tag { position: absolute; left: -25%; right: -25%; bottom: -2%; text-align: center; z-index: 5; font-size: min(4.8vw, 5.6vh); font-weight: 900; color: #fff; white-space: nowrap; text-shadow: 0 3px 0 #1a237e, 0 0 10px #1a237e; }
  .labItem.sway { animation: swayLab 3s ease-in-out infinite; }
  @keyframes swayLab { 50% { transform: translateY(-4px); } }
  .labItem.picked .peek { transition: bottom .6s, height .6s; bottom: 40%; height: min(26vw, 32vh); }
  #labTable { position: absolute; left: 0; right: 0; bottom: 0; height: 12%; background: linear-gradient(#5d4037, #3e2723); z-index: 3; }
  #labBeaker { position: absolute; bottom: 10%; right: 4%; font-size: min(8vw, 9vh); z-index: 4; }

  .voicePanel { position: absolute; left: 0; right: 0; bottom: 0; z-index: 60; padding: 10px 14px 16px; background: linear-gradient(transparent, rgba(0,0,0,.75) 30%); display: none; text-align: center; }
  .voicePanel.show { display: block; }
  .voicePanel .ask { font-size: min(5vw, 5vh); font-weight: 900; color: #ffeb3b; text-shadow: 0 3px 0 #000; margin-bottom: 6px; min-height: 1.3em; }
  .voicePanel .row { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }
  .micBtn { font-size: min(6vw, 6.5vh); padding: 14px 44px; border-radius: 50px; background: linear-gradient(#ef5350, #c62828); box-shadow: 0 7px 0 #7f0000; }
  .micBtn.rec { animation: pulse 0.9s infinite; background: linear-gradient(#ff8a80, #ff1744); }
  .vmeter { width: min(36vw, 300px); height: 18px; background: rgba(255,255,255,.2); border-radius: 9px; overflow: hidden; }
  .vmeter > div { height: 100%; width: 0; background: linear-gradient(90deg, #66bb6a, #ffee58, #ef5350); transition: width .08s; }
  .vstatus { font-size: 16px; color: #cfd8dc; margin-top: 4px; min-height: 1.3em; }
  .vstatus.ok { color: #69f0ae; font-weight: bold; } .vstatus.ng { color: #ff8a80; }
  .learn { margin-top: 4px; font-size: 12px; color: #b0bec5; }
  .learn button { font-size: 12px; margin-left: 6px; padding: 3px 8px; border-radius: 8px; border: 1px solid #78909c; background: rgba(255,255,255,.12); color: #fff; }

  #battle { background: linear-gradient(#5ec8ff 0%, #bfeaff 45%, #8bd45a 45%, #4e9e2f 100%); }
  #battle .bg-ground { position: absolute; left: 0; right: 0; top: 45%; bottom: 0; background: radial-gradient(ellipse at 28% 78%, rgba(0,0,0,.18), transparent 30%), radial-gradient(ellipse at 74% 38%, rgba(0,0,0,.18), transparent 26%); }
  .poke { position: absolute; display: flex; align-items: center; justify-content: center; font-size: min(18vw, 22vh); transition: transform .15s; }
  .poke img { width: 100%; height: 100%; object-fit: contain; }
  #enemyPoke { right: 8%; top: 12%; width: min(30vw, 36vh); height: min(30vw, 36vh); }
  #playerPoke { left: 6%; top: 34%; width: min(34vw, 40vh); height: min(34vw, 40vh); }
  .poke.hit { animation: hitShake .5s; }
  @keyframes hitShake { 0%,100% { transform: translate(0); filter: none; } 20% { transform: translate(-14px,0); filter: brightness(2.4) saturate(.3); } 40% { transform: translate(14px,0); } 60% { transform: translate(-10px,0); filter: brightness(2); } 80% { transform: translate(10px,0); } }
  .poke.faint { animation: faint 1s forwards; }
  @keyframes faint { to { transform: translateY(80px) scale(.6); opacity: 0; } }
  .poke.enter { animation: enterP .6s cubic-bezier(.2,1.6,.4,1); }
  @keyframes enterP { from { transform: scale(0); } to { transform: scale(1); } }
  .hpBox { position: absolute; background: rgba(255,255,255,.92); border-radius: 14px; padding: 8px 14px; border: 3px solid #37474f; color: #263238; min-width: min(40vw, 300px); box-shadow: 0 4px 0 rgba(0,0,0,.25); z-index: 10; }
  .hpBox .nm { font-size: min(3.6vw, 3.6vh); font-weight: 900; }
  .hpBox .hpTxt { font-size: 15px; font-weight: bold; float: right; margin-top: 3px; }
  .hpBar { height: 16px; background: #455a64; border-radius: 8px; overflow: hidden; margin-top: 4px; border: 2px solid #263238; }
  .hpBar > div { height: 100%; width: 100%; background: #43a047; transition: width .7s, background .3s; }
  #enemyBox { left: 4%; top: 6%; } #playerBox { right: 4%; top: 52%; }
  #stageTag { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); z-index: 20; background: rgba(0,0,0,.55); border-radius: 20px; padding: 4px 18px; font-size: 18px; font-weight: bold; }
  #battleMsg { position: absolute; left: 4%; right: 4%; bottom: 190px; z-index: 30; min-height: 62px; background: rgba(0,0,0,.72); border: 3px solid #fff; border-radius: 14px; padding: 12px 18px; font-size: min(4vw, 4.4vh); font-weight: bold; text-align: center; display: none; }
  #battleMsg.show { display: block; }

  #slotWrap { position: absolute; left: 50%; bottom: 215px; transform: translateX(-50%); z-index: 70; display: none; flex-direction: column; align-items: center; gap: 6px; }
  #slotWrap.show { display: flex; }
  #slotWin { width: min(72vw, 560px); height: min(11vh, 76px); background: #fff; border: 5px solid #ffb300; border-radius: 16px; overflow: hidden; position: relative; box-shadow: 0 0 22px rgba(255,179,0,.8); }
  #slotReel { position: absolute; left: 0; right: 0; top: 0; }
  #slotReel div { box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: min(5.4vw, 5.4vh); font-weight: 900; color: #263238; white-space: nowrap; }
  #slotLabel { font-size: 18px; font-weight: bold; text-shadow: 0 2px 0 #000; }

  #fxLayer { position: absolute; inset: 0; pointer-events: none; z-index: 35; overflow: hidden; }
  #fxCanvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #moveName { position: absolute; left: 0; right: 0; top: 40%; text-align: center; font-size: min(8vw, 9vh); font-weight: 900; color: #fff; text-shadow: 0 0 14px #ff6f00, 0 6px 0 #b71c1c; z-index: 38; display: none; }
  #moveName.show { display: block; animation: movePop .7s; }
  @keyframes movePop { 0% { transform: scale(.2); opacity: 0; } 50% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(1); } }
  #dmgText { position: absolute; z-index: 39; font-size: min(10vw, 12vh); font-weight: 900; color: #fff; text-shadow: 0 0 6px #d50000, 0 5px 0 #d50000; display: none; }
  #dmgText.show { display: block; animation: dmgUp 1s forwards; }
  @keyframes dmgUp { 0% { transform: translateY(0) scale(.5); opacity: 0; } 20% { transform: translateY(-10px) scale(1.3); opacity: 1; } 100% { transform: translateY(-60px) scale(1); opacity: 0; } }

  /* しょうり画面 */
  #win { background: radial-gradient(circle at 50% 40%, #fff59d, #ff9800 75%); text-align: center; }
  #winBox { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; z-index: 5; }
  #winTitle { font-size: min(12vw, 14vh); font-weight: 900; color: #fff; text-shadow: 0 6px 0 #d84315, 0 0 24px #fff; animation: glow 1.4s infinite alternate; }
  #winPoke { width: min(34vw, 40vh); height: min(34vw, 40vh); display: flex; align-items: center; justify-content: center; font-size: min(22vw, 26vh); animation: trophy 1.6s ease-in-out infinite; }
  #winPoke img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 0 20px #fff); }
  #winSub { font-size: min(4.4vw, 5vh); font-weight: bold; color: #4e342e; background: rgba(255,255,255,.7); border-radius: 18px; padding: 6px 26px; }

  #result { background: radial-gradient(circle at 50% 40%, #ffd54f, #ff6f00 70%); text-align: center; }
  #resultBox { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; z-index: 5; }
  #resTitle { font-size: min(9vw, 11vh); font-weight: 900; color: #fff; text-shadow: 0 6px 0 #b71c1c, 0 0 20px #fff; }
  #trophy { font-size: min(30vw, 36vh); animation: trophy 1.6s ease-in-out infinite; filter: drop-shadow(0 0 30px #fff59d); }
  @keyframes trophy { 50% { transform: translateY(-14px) scale(1.06) rotate(3deg); } }
  #resSub { font-size: min(4.6vw, 5vh); font-weight: bold; color: #4e342e; }
  .confetti { position: absolute; top: -20px; width: 14px; height: 14px; animation: fall linear forwards; z-index: 1; pointer-events: none; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }

  #versus { position: absolute; inset: 0; z-index: 50; display: none; background: radial-gradient(circle, #ff1744 0%, #000 80%); align-items: center; justify-content: center; font-size: min(14vw, 16vh); font-weight: 900; color: #fff; text-shadow: 0 0 30px #fff; text-align: center; }
  #versus.show { display: flex; animation: vsIn .6s; }
  @keyframes vsIn { from { transform: scale(3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
</style>
</head>
<body>
<div id="warn"></div>

<section id="start" class="screen show">
  <canvas id="stormCv"></canvas>
  <div id="startBox">
    <div id="ballLogo"></div>
    <div id="logo">ポケモン<br>もじバトル</div>
    <button class="btn" id="startBtn">⚡ バトルスタート</button>
    <div id="startSub">マイクで よんで たたかおう!</div>
  </div>
</section>

<section id="lab" class="screen">
  <div class="title">どの ポケモンで たたかう?</div>
  <div class="stage" id="labStage"></div>
  <div id="labBeaker">🧪</div>
  <div id="labRow"></div>
  <div id="labTable"></div>
  <div class="voicePanel" id="labVoice">
    <div class="ask" id="labAsk">なまえを よんで えらぼう!</div>
    <div class="row"><button class="btn micBtn" id="labMic">🎤 はなす</button><div class="vmeter"><div id="labMeter"></div></div></div>
    <div class="vstatus" id="labStatus"></div>
    <div class="learn" id="labLearn"></div>
  </div>
</section>

<section id="battle" class="screen">
  <div class="bg-ground"></div>
  <div id="stageTag"></div>
  <div class="hpBox" id="enemyBox"><span class="nm" id="eName"></span><span class="hpTxt" id="eHpTxt"></span><div class="hpBar"><div id="eHp"></div></div></div>
  <div class="poke" id="enemyPoke"></div>
  <div class="poke" id="playerPoke"></div>
  <div class="hpBox" id="playerBox"><span class="nm" id="pName"></span><span class="hpTxt" id="pHpTxt"></span><div class="hpBar"><div id="pHp"></div></div></div>
  <div id="fxLayer"><canvas id="fxCanvas"></canvas></div>
  <div id="moveName"></div>
  <div id="dmgText"></div>
  <div id="battleMsg"></div>
  <div id="slotWrap"><div id="slotLabel">わざを えらんでいます…</div><div id="slotWin"><div id="slotReel"></div></div></div>
  <div class="voicePanel" id="batVoice">
    <div class="ask" id="batAsk"></div>
    <div class="row"><button class="btn micBtn" id="batMic">🎤 はなす</button><div class="vmeter"><div id="batMeter"></div></div></div>
    <div class="vstatus" id="batStatus"></div>
    <div class="learn" id="batLearn"></div>
  </div>
  <div id="versus"></div>
</section>

<section id="win" class="screen">
  <div id="winBox">
    <div id="winTitle">しょうり!</div>
    <div id="winPoke"></div>
    <div id="winSub"></div>
    <button class="btn gold" id="nextBtn" style="font-size:28px">つぎへ ▶</button>
  </div>
</section>

<section id="result" class="screen">
  <div id="resultBox">
    <div id="resTitle">ゆうしょう!</div>
    <div id="trophy">🏆</div>
    <div id="resSub"></div>
    <button class="btn gold" id="againBtn" style="font-size:28px">もういちど あそぶ</button>
  </div>
</section>

<script>

    ["サウザンアロー",30,"arrow","サウザンアロー"],
    ["コアパニッシャー",34,"beam","コアパニッシャー"],

const BGM_DIR = "bgm/";
const BGM_EXTS = ["mp3", "m4a", "wav", "ogg"];
const BGM_VOL = 0.35;
const BGM_MAP = { start: "start", lab: "lab", battle: "battle", win: "win", result: "win" };
const bgm = {
  cache: {}, cur: null, name: null, want: null, micPaused: false, blocked: false,
  load(name) {
    if (this.cache[name]) return this.cache[name];
    this.cache[name] = new Promise(resolve => {
      let i = 0;
      const next = () => {
        if (i >= BGM_EXTS.length) { resolve(null); return; }
        const a = new Audio();
        a.loop = true; a.volume = BGM_VOL; a.preload = "auto";
        let settled = false;
        const ok = () => { if (!settled) { settled = true; resolve(a); } };
        const ng = () => { if (!settled) { settled = true; next(); } };
        a.addEventListener("loadedmetadata", ok);
        a.addEventListener("canplay", ok);
        a.addEventListener("error", ng);
        setTimeout(() => { if (!settled) { settled = true; resolve(a); } }, 5000);
        a.src = BGM_DIR + name + "." + BGM_EXTS[i++];
        a.load();
      };
      next();
    });
    return this.cache[name];
  },
  async play(name) {
    this.want = name;
    if (this.cur && this.name !== name) {
      this.cur.pause();
      try { this.cur.currentTime = 0; } catch (e) {}
      this.cur = null; this.name = null;
    }
    if (this.cur && this.name === name) { this.tryPlay(); return; }
    const a = await this.load(name);
    if (this.want !== name || !a) return;
    this.cur = a; this.name = name;
    this.tryPlay();
  },
  tryPlay() {
    if (!this.cur || this.micPaused) return;
    const p = this.cur.play();
    if (p && p.catch) p.catch(() => { this.blocked = true; });
  },
  pauseMic() { this.micPaused = true; if (this.cur) this.cur.pause(); },
  resumeMic() { this.micPaused = false; this.tryPlay(); },
  kick() {
    if (!this.want) this.play(BGM_MAP[currentScreen] || "start");
    else if (this.blocked) { this.blocked = false; this.tryPlay(); }
  }
};

function toHira(s) { return s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60)); }
const SMALLMAP = { "ぁ":"あ","ぃ":"い","ぅ":"う","ぇ":"え","ぉ":"お","ゃ":"や","ゅ":"ゆ","ょ":"よ","っ":"つ","ゎ":"わ" };
const DIGIT = ["ぜろ","いち","に","さん","よん","ご","ろく","なな","はち","きゅう"];
function numToKana(str) {
  str = str.replace(/(\d+)万/g, (m, n) => numToKana(n) + "まん");
  return str.replace(/\d+/g, m => {
    const n = parseInt(m, 10);
    if (n === 100000) return "じゅうまん";
    if (n === 10000) return "いちまん";
    if (n === 10) return "じゅう";
    if (n < 10) return DIGIT[n];
    return m.split("").map(c => DIGIT[+c]).join("");
  });
}
function normalize(s) {
  s = (s || "").normalize("NFKC");
  s = numToKana(s);
  s = toHira(s).toLowerCase();
  s = s.replace(/[\s、。・!?,.\-ー〜~「」『』()()]/g, "");
  s = s.replace(/[ぁぃぅぇぉゃゅょっゎ]/g, c => SMALLMAP[c] || c);
  return s;
}
function lev(a, b) {
  const m = a.length, n = b.length;
  if (!m) return n; if (!n) return m;
  const d = Array.from({ length: m + 1 }, (_, i) => [i]);
  for (let j = 1; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++)
    d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return d[m][n];
}
function sim(heard, target) {
  const a = normalize(heard), b = normalize(target);
  if (!a || !b) return 0;
  if (a === b) return 1;
  if (a.includes(b) && a.length <= b.length + 3) return 1;
  return 1 - lev(a, b) / Math.max(a.length, b.length);
}
let LEARNED = {};
try { LEARNED = JSON.parse(localStorage.getItem("mojiBattleLearned") || "{}"); } catch (e) { LEARNED = {}; }
function saveLearned() { try { localStorage.setItem("mojiBattleLearned", JSON.stringify(LEARNED)); } catch (e) {} }
function addLearned(key, text) {
  if (!text) return;
  LEARNED[key] = LEARNED[key] || [];
  if (!LEARNED[key].includes(text)) LEARNED[key].push(text);
  saveLearned();
}
function scoreFor(topic, alts) {
  const names = [topic.main, ...(topic.alias || []), ...(LEARNED[topic.key] || [])];
  let best = 0;
  for (const a of alts) for (const n of names) best = Math.max(best, sim(a, n));
  return best;
}

const SR_CLASS = window.SpeechRecognition || window.webkitSpeechRecognition;
let micStream = null, micCtx = null, micAnalyser = null;
async function ensureMic() {
  if (micStream && micStream.active) return true;
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    micCtx = micCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (micCtx.state === "suspended") await micCtx.resume();
    const src = micCtx.createMediaStreamSource(micStream);
    micAnalyser = micCtx.createAnalyser(); micAnalyser.fftSize = 512; src.connect(micAnalyser);
    return true;
  } catch (e) { warn("マイクの きょかが ひつようです: " + e.name); return false; }
}

function listenOnce(meterEl, onInterim) {
  return new Promise(async resolve => {
    if (!SR_CLASS) { resolve({ alts: [], peak: 0, error: "unsupported" }); return; }
    if ("speechSynthesis" in window) speechSynthesis.cancel();
    bgm.pauseMic();
    const ok = await ensureMic();
    if (!ok) { bgm.resumeMic(); resolve({ alts: [], peak: 0, error: "mic" }); return; }
    const buf = new Uint8Array(micAnalyser.fftSize);
    let peak = 0, raf = 0, running = true;
    const loop = () => {
      if (!running) return;
      micAnalyser.getByteTimeDomainData(buf);
      let mx = 0; for (let i = 0; i < buf.length; i++) mx = Math.max(mx, Math.abs(buf[i] - 128));
      const v = Math.min(100, mx / 128 * 160); peak = Math.max(peak, v);
      if (meterEl) meterEl.style.width = v + "%";
      raf = requestAnimationFrame(loop);
    };
    loop();
    const rec = new SR_CLASS();
    rec.lang = "ja-JP"; rec.continuous = false; rec.interimResults = true; rec.maxAlternatives = 5;
    let finalAlts = [], err = null, finished = false;
    const finish = () => {
      if (finished) return; finished = true; running = false; cancelAnimationFrame(raf);
      if (meterEl) meterEl.style.width = "0%";
      setTimeout(() => bgm.resumeMic(), 300);
      resolve({ alts: finalAlts, peak, error: err });
    };
    rec.onresult = e => {
      const res = e.results[e.results.length - 1], alts = [];
      for (let i = 0; i < res.length; i++) alts.push(res[i].transcript);
      if (onInterim) onInterim(alts[0] || "");
      if (res.isFinal) finalAlts = alts;
    };
    rec.onerror = e => { err = e.error; };
    const timer = setTimeout(() => { try { rec.stop(); } catch (e) {} }, 6500);
    rec.onend = () => { clearTimeout(timer); finish(); };
    try { rec.start(); } catch (e) { err = "start"; clearTimeout(timer); finish(); }
  });
}

/* 声で言うチャレンジ(スロット枠と技の表示はそのまま。マイクボタンで言う) */
async function voiceChallenge(panel, topic, askText) {
  panel.root.classList.add("show");
  panel.ask.textContent = askText;
  let fails = 0;
  panel.status.textContent = "ボタンをおして、よんでね"; panel.status.className = "vstatus";
  panel.learn.innerHTML = "";
  while (true) {
    await new Promise(res => {
      const h = () => { panel.mic.removeEventListener("click", h); res(); };
      panel.mic.addEventListener("click", h);
    });
    SE.tap();
    panel.mic.classList.add("rec"); panel.mic.textContent = "👂 きいてるよ…";
    panel.status.textContent = "「" + topic.main + "」と いってね!"; panel.status.className = "vstatus";
    const r = await listenOnce(panel.meter, t => { panel.status.textContent = "きこえた: " + t; });
    panel.mic.classList.remove("rec"); panel.mic.textContent = "🎤 はなす";
    if (r.error === "unsupported") warn("このブラウザは おんせいにんしき に たいおうしていません");
    const score = r.alts.length ? scoreFor(topic, r.alts) : 0;
    if (score >= PASS_RATE) {
      panel.status.textContent = "🎉 すごい! よめたね!"; panel.status.className = "vstatus ok";
      panel.learn.innerHTML = "";
      SE.ok();
      await sleep(700);
      panel.root.classList.remove("show");
      return true;
    }
    fails++;
    const heard = r.alts[0] || "";
    panel.status.className = "vstatus ng";
    if (fails >= FAIL_RESCUE && (r.peak >= VOL_PASS || !SR_CLASS)) {
      panel.status.textContent = "おおきな こえが でたね! OK!"; panel.status.className = "vstatus ok";
      SE.ok(); await sleep(800);
      panel.root.classList.remove("show");
      return true;
    }
    panel.status.textContent = heard ? "おしい! きこえた:「" + heard + "」もういちど!" : "こえが きこえなかった… もういちど!";
    SE.ng();
    if (heard) {
      panel.learn.innerHTML = "「" + heard + "」は正解? ";
      const b = document.createElement("button"); b.textContent = "これも正解にする";
      b.onclick = () => { addLearned(topic.key, heard); b.textContent = "登録しました"; b.disabled = true; };
      panel.learn.appendChild(b);
    }
  }
}

const stormCv = $("stormCv"), sctx = stormCv.getContext("2d");

}

const FXCOL = { electric:"#fff176", thunder:"#fff59d", dash:"#fafafa", iron:"#b0bec5", aura:"#4fc3f7", bone:"#efebe9", punch:"#ffab91", slash:"#e1f5fe", fire:"#ff7043", fireball:"#ff5722", water:"#4fc3f7", wave:"#29b6f6", bubble:"#b3e5fc", ice:"#b2ebf2", rock:"#a1887f", meteor:"#ffcc80", dragon:"#ba68c8", beam:"#ffffff", shadow:"#7e57c2", ring:"#80deea", arrow:"#c5e1a5", quake:"#8d6e63", sound:"#fff59d", hit:"#ffffff", leaf:"#81c784", bite:"#ffffff" };

function runAnim(dur, draw) {
  return new Promise(res => {
    const t0 = performance.now();
    const step = now => {
      const p = Math.min(1, (now - t0) / dur);
      fctx.setTransform(1, 0, 0, 1, 0, 0);
      fctx.clearRect(0, 0, fxCv.width, fxCv.height);
      draw(p);
      fctx.setTransform(1, 0, 0, 1, 0, 0);
      p < 1 ? requestAnimationFrame(step) : (fctx.clearRect(0, 0, fxCv.width, fxCv.height), res());
    };
    requestAnimationFrame(step);
  });
}

    case "sound": {
      await runAnim(1000, p => {
        for (let k = 0; k < 5; k++) { const r = Math.max(0, p * 360 - k * 60); fctx.strokeStyle = "rgba(255,245,157," + (1 - p) + ")"; fctx.lineWidth = 7; fctx.beginPath(); fctx.arc(from.x, from.y, r, -.7, .7); fctx.stroke(); }
        if (p > .3) { fctx.fillStyle = "rgba(255,255,255," + ((p - .3) * .5) + ")"; fctx.fillRect(0, 0, W, H); }
      });
      break;
    }
    default: {
      await runAnim(700, p => { fctx.fillStyle = "rgba(255,255,255," + (1 - p) + ")"; fctx.beginPath(); fctx.arc(to.x, to.y, p * 160, 0, 7); fctx.fill(); });
    }
  }
  mn.classList.remove("show");
  const dt = $("dmgText");
  dt.textContent = "-" + dmg; dt.style.left = (to.x - 60) + "px"; dt.style.top = (to.y - 80) + "px";
  dt.classList.remove("show"); void dt.offsetWidth; dt.classList.add("show");
  setTimeout(() => dt.classList.remove("show"), 1000);
}

function confetti() {
  const cols = ["#ef5350", "#ffca28", "#66bb6a", "#42a5f5", "#ab47bc", "#ff7043"];
  const host = document.querySelector(".screen.show") || document.body;
  for (let i = 0; i < 60; i++) {
    const d = document.createElement("div"); d.className = "confetti";
    d.style.left = Math.random() * 100 + "vw"; d.style.background = cols[Math.floor(Math.random() * cols.length)];
    d.style.animationDuration = (1.5 + Math.random() * 2) + "s"; d.style.animationDelay = Math.random() * .4 + "s";
    host.appendChild(d); setTimeout(() => d.remove(), 4500);
  }
}
async function showResult() {
  show("result");
  $("resSub").textContent = myMain.name + " と ぜんぶ かったね!";
  SE.fanfare(); confetti(); speak("ゆうしょう! おめでとう!");
  setTimeout(confetti, 1500); setTimeout(confetti, 3000);
}
